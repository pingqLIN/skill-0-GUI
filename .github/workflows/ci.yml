name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runtime entrypoints
        run: |
          node --check server.mjs
          node --check bridge/skill0Bridge.mjs

      - name: Type check
        run: npm run lint

      - name: Check shared docs sync
        run: npm run docs:check

      - name: Run tests
        run: npm test

      - name: Verify standard build size
        run: npm run verify:build-size

      - name: Verify public build boundary
        run: npm run verify:public-build
